<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Library - AI Learning Assistant</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Main Stylesheet -->
    <link rel="stylesheet" href="styles.css?v=2.6">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Lora:wght@700&display=swap" rel="stylesheet">
    <!-- Feather Icons -->
    <script src="https://cdn.jsdelivr.net/npm/feather-icons/dist/feather.min.js"></script>
</head>
<body class="library-body">

    <div id="library-container">
        <!-- Sidebar for Collections -->
        <aside id="library-sidebar">
            <div class="sidebar-header">
                <h1 class="main-title">My Library</h1>
            </div>
            
            <div class="sidebar-content">
                <!-- Collections List -->
                <ul id="collectionsList" class="collections-list">
                    <!-- Collections will be loaded here dynamically -->
                </ul>
            </div>
            
            <div class="sidebar-footer">
                <button id="newCollectionBtn" class="btn btn-secondary w-full mb-2">
                    <i data-feather="plus"></i>
                    <span>New Collection</span>
                </button>
                <button id="debugButton" class="btn-icon" title="Open Debug Log">
                    <i data-feather="tool"></i>
                </button>
            </div>
        </aside>

        <!-- Main Content Area for Items -->
        <main id="library-content" class="hidden">
            <div class="content-header">
                <h2 id="current-collection-title" class="collection-title"></h2>
                
                <div class="header-actions">
                    <button id="viewToggleButton" class="btn btn-secondary">Chat with this Collection</button>
                    
                    <div class="collection-actions">
                        <button id="renameCollectionBtn" class="btn-icon" title="Rename Collection"><i data-feather="edit-2"></i></button>
                        <button id="deleteCollectionBtn" class="btn-icon btn-danger" title="Delete Collection"><i data-feather="trash-2"></i></button>
                    </div>
                </div>
            </div>
            
            <div id="library-view-container">
                <div id="itemsList" class="items-list-container">
                    <!-- Items will be loaded here dynamically -->
                </div>
                <div id="empty-state" class="empty-state-container hidden">
                    <i data-feather="inbox" class="empty-state-icon"></i>
                    <h3 class="empty-state-title">No items yet</h3>
                    <p class="empty-state-text">Save transcripts or learning packets from the main app to see them here.</p>
                </div>
            </div>
        
            <div id="chat-container" class="chat-interface hidden">
                <div id="chat-messages" class="chat-messages">
                    <div class="chat-message bot-message">
                        <p>Ask me anything about the content in this collection, or select "All Collections" to chat with your entire library.</p>
                    </div>
                </div>
                <div class="chat-input-area">
                    <textarea id="chat-input" placeholder="Ask a question..."></textarea>
                    <button id="send-chat-btn" title="Send">
                        <i data-feather="send"></i>
                    </button>
                </div>
            </div>
        </main>
    </div>

    <!-- Main Application Script for this page -->
    <script type="module" src="library.js"></script>
    <script>
        // Initialize Feather Icons after the page loads
        feather.replace();
    </script>
</body>
</html>
