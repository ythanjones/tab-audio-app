<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI-Powered Audio Transcriber</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Custom Stylesheet -->
    <link rel="stylesheet" href="styles.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-slate-200 text-slate-800 flex items-center justify-center min-h-screen p-4">

    <!-- Main container for the application -->
    <div id="app-container" class="w-full max-w-3xl mx-auto p-8 bg-white rounded-md shadow-lg space-y-8 relative">
        
        <!-- Top bar for icons -->
        <div class="absolute top-0 left-0 w-full flex justify-between items-start px-8 py-6">
            <!-- API Key Icon and Input -->
            <div id="apiKeyContainer" class="interactive-icon-container">
                 <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon-animated text-slate-500">
                    <circle cx="7" cy="12" r="4"></circle>
                    <line x1="11" y1="12" x2="22" y2="12"></line>
                    <line x1="14" y1="12" x2="14" y2="16"></line>
                    <line x1="17" y1="12" x2="17" y2="18"></line>
                    <line x1="20" y1="12" x2="20" y2="15"></line>
                </svg>
                <input type="password" id="apiKeyInput" class="border-slate-300 rounded-md p-2 text-slate-700 focus:outline-none focus:ring-2 focus:ring-teal-500" placeholder="Enter Session API Key...">
            </div>

            <!-- Login Icon and Inputs -->
             <div id="loginContainer" class="interactive-icon-container flex-row-reverse">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon-animated icon-animated-user text-slate-500 transition-transform duration-300">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                    <circle cx="12" cy="7" r="4"></circle>
                </svg>
                <div id="login-form" class="flex flex-col">
                    <input type="email" id="emailInput" class="login-input text-sm focus:outline-none focus:ring-2 focus:ring-teal-500" placeholder="Email">
                    <div id="password-wrapper" class="login-form-extra">
                        <input type="password" id="passwordInput" class="login-input text-sm focus:outline-none focus:ring-2 focus:ring-teal-500" placeholder="Password">
                    </div>
                     <div id="auth-buttons" class="login-form-extra space-y-2">
                        <button id="loginButton" class="w-full text-sm bg-teal-600 text-white py-1.5 rounded-md hover:bg-teal-700">Login / Sign Up</button>
                    </div>
                </div>
            </div>

            <!-- User Info / Logout Button -->
             <div id="userInfo" class="items-center gap-4">
                 <span id="userEmail" class="text-sm font-medium text-slate-700"></span>
                 <!-- History Button -->
                 <button id="historyButton" title="View History" class="text-slate-500 hover:text-teal-600">
                    <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 4v6h6"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
                 </button>
                 <!-- Settings Button -->
                 <button id="settingsButton" title="Settings" class="text-slate-500 hover:text-teal-600">
                     <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
                 </button>
                 <button id="logoutButton" class="text-slate-500 hover:text-red-600">
                     <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
                 </button>
             </div>
        </div>

        <!-- Header -->
        <div class="text-center pt-20">
            <h1 class="text-4xl font-semibold text-slate-800">YouTube Learning Assistant</h1>
        </div>
        
        <!-- Error Message Display -->
        <div id="error-message" class="hidden bg-red-100 border border-red-300 text-red-800 px-4 py-3 rounded-lg" role="alert">
            <strong class="font-bold">Error:</strong>
            <span class="block sm:inline" id="error-text"></span>
        </div>
        
        <!-- Controls & Status Section -->
        <div class="text-center space-y-4 pt-4">
             <div class="flex flex-col sm:flex-row items-center justify-center gap-4">
                <button id="startButton" class="w-full sm:w-auto bg-teal-600 text-white font-semibold py-2 px-6 rounded-md transition-all duration-200 hover:bg-teal-700 focus:outline-none focus:ring-2 focus:ring-teal-500 focus:ring-opacity-75">
                    Start Recording
                </button>
                <button id="stopButton" class="w-full sm:w-auto border border-slate-300 text-slate-600 font-semibold py-2 px-6 rounded-md transition-all duration-200 hover:bg-slate-200 focus:outline-none focus:ring-2 focus:ring-slate-400 focus:ring-opacity-75 btn-disabled" disabled>
                    Stop Recording
                </button>
            </div>
            <p class="text-sm text-slate-500 h-5">Status: <span id="status" class="font-semibold text-teal-600"></span></p>
        </div>

        <!-- Transcription & AI Actions Section -->
        <div class="space-y-4 pt-8 border-t border-slate-200">
            <div class="flex justify-between items-center">
                 <!-- Transcription Output DIV, styled like a textarea -->
                <div id="transcriptionOutput" class="w-full h-48 bg-slate-100 border border-slate-300 rounded-md p-4 text-slate-800 overflow-y-auto focus:outline-none focus:ring-2 focus:ring-teal-500" placeholder="Transcription will appear here..."></div>
                <button id="saveButton" class="ml-4 px-4 py-2 text-sm font-semibold text-white bg-green-600 rounded-md hover:bg-green-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-green-500 btn-disabled" disabled title="Save Transcript">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>
                </button>
            </div>


            <!-- AI Teacher Actions -->
             <div class="pt-4 space-y-2">
                 <h3 class="text-sm font-semibold text-slate-500 uppercase tracking-wider">Teacher AI</h3>
                 <div id="aiActions" class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                    <button data-prompt-id="key_concepts" class="ai-button w-full border border-slate-300 text-slate-600 font-semibold py-2 px-4 rounded-md transition-all duration-200 hover:bg-slate-200 btn-disabled" disabled>Key Concepts</button>
                    <button data-prompt-id="explain_like_im_10" class="ai-button w-full border border-slate-300 text-slate-600 font-semibold py-2 px-4 rounded-md transition-all duration-200 hover:bg-slate-200 btn-disabled" disabled>Explain Like I'm 10</button>
                    <button data-prompt-id="main_lessons" class="ai-button w-full border border-slate-300 text-slate-600 font-semibold py-2 px-4 rounded-md transition-all duration-200 hover:bg-slate-200 btn-disabled" disabled>Main Lessons</button>
                 </div>
             </div>
             
             <!-- Learning Resource Generators -->
             <div class="pt-4 space-y-2">
                 <h3 class="text-sm font-semibold text-slate-500 uppercase tracking-wider">Learning Resource Generators</h3>
                 <div id="generatorActions" class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                    <button data-prompt-id="generate_flashcards" class="ai-button w-full bg-teal-50 border border-teal-300 text-teal-700 font-semibold py-2 px-4 rounded-md transition-all duration-200 hover:bg-teal-100 btn-disabled" disabled>Generate Flashcards</button>
                 </div>
             </div>
        </div>

        <!-- Debug Report Button -->
        <button id="debugButton" class="fixed bottom-4 right-4 bg-slate-700 text-white p-2 rounded-full shadow-lg hover:bg-slate-800 transition-colors" title="Generate Debug Report">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 4.5l-2.7 5.4-5.4 2.7 5.4 2.7 2.7 5.4 2.7-5.4 5.4-2.7-5.4-2.7-2.7-5.4zM7 21l-4-4"/></svg>
        </button>
    </div>

    <!-- Modal for AI Results & Settings -->
    <div id="modal-backdrop" class="fixed inset-0 bg-black bg-opacity-60 flex items-center justify-center p-4 hidden opacity-0">
        <div id="modal-content" class="bg-white rounded-lg shadow-xl w-full max-w-lg p-6 transform scale-95 opacity-0">
            <div class="flex justify-between items-center mb-4">
                <h2 id="modal-title" class="text-2xl font-semibold text-slate-900"></h2>
                <button id="modal-close" class="text-slate-400 hover:text-slate-800 text-2xl leading-none">&times;</button>
            </div>
            <div id="modal-body" class="text-slate-700 max-h-96 overflow-y-auto"></div>
            <div id="modal-feedback" class="mt-4 pt-4 border-t border-slate-200 text-center hidden">
                <p class="text-sm text-slate-600 mb-2">Was this response helpful?</p>
                <div class="flex justify-center gap-4">
                    <button class="feedback-btn p-2 rounded-full hover:bg-green-100" data-rating="positive">
                        <svg class="w-6 h-6 text-green-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M6.633 10.5c.806 0 1.533-.424 2.031-1.08a9.041 9.041 0 012.861-2.4c.723-.384 1.35-.956 1.653-1.715a4.498 4.498 0 00.322-1.672V3a.75.75 0 01.75-.75A2.25 2.25 0 0116.5 4.5c0 1.152-.26 2.243-.723 3.218-.266.558.107 1.282.725 1.282h3.126c1.026 0 1.945.694 2.054 1.715.045.422.068.85.068 1.285a11.95 11.95 0 01-2.649 7.521c-.388.482-.987.729-1.605.729H13.48c-.483 0-.964-.078-1.423-.23l-3.114-1.04a4.501 4.501 0 00-1.423-.23H5.904M6.633 10.5l-1.87-1.87a.75.75 0 00-1.06 1.061l1.87 1.87M6.633 10.5v11.25c0 .621-.504 1.125-1.125 1.125H3.388c-.621 0-1.125-.504-1.125-1.125V10.5" /></svg>
                    </button>
                    <button class="feedback-btn p-2 rounded-full hover:bg-red-100" data-rating="negative">
                        <svg class="w-6 h-6 text-red-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M7.864 4.5c.806 0 1.533.424 2.031 1.08a9.041 9.041 0 012.861 2.4c.723-.384 1.35-.956 1.653-1.715a4.498 4.498 0 00.322-1.672V3a.75.75 0 01.75-.75A2.25 2.25 0 0116.5 4.5c0 1.152-.26 2.243-.723 3.218-.266.558.107 1.282.725 1.282h3.126c1.026 0 1.945.694 2.054 1.715.045.422.068.85.068 1.285a11.95 11.95 0 01-2.649 7.521c-.388.482-.987.729-1.605.729H13.48c-.483 0-.964-.078-1.423-.23l-3.114-1.04a4.501 4.501 0 00-1.423-.23H5.904M7.864 4.5L6 6.375v11.25c0 .621-.504 1.125-1.125 1.125H3.388c-.621 0-1.125-.504-1.125-1.125V6.375L6 4.5" /></svg>
                    </button>
                </div>
                <div id="detailed-feedback-container" class="mt-2 hidden">
                     <textarea id="detailed-feedback-input" class="w-full text-sm border-slate-300 rounded-md" placeholder="Optional: Why was this unhelpful?"></textarea>
                     <button id="submit-detailed-feedback" class="mt-2 text-xs bg-slate-600 text-white px-2 py-1 rounded-md">Submit Feedback</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Main Application Script -->
    <script type="module" src="app.js"></script>

</body>
</html>
