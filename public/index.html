<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Learning Assistant</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Custom Stylesheet -->
    <link rel="stylesheet" href="styles.css?v=2.1"> <!-- Version updated to v2.1 -->
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Lora:wght@700&display=swap" rel="stylesheet">
    <!-- Feather Icons -->
    <script src="https://cdn.jsdelivr.net/npm/feather-icons/dist/feather.min.js"></script>
</head>
<body>

    <!-- Main App Container -->
    <div id="app-container">

        <!-- Top Right Header for User Auth & Library Link -->
        <header class="main-header">
            <div id="loginContainer">
                <!-- Simplified Login: Will be handled by JS -->
            </div>
            <div id="userInfo" class="hidden">
                <span id="userEmail" class="user-email"></span>
                <a href="library.html" id="libraryLink" class="library-link" title="My Library">
                    <i data-feather="book-open"></i>
                </a>
                <button id="logoutButton" class="logout-button" title="Logout">
                     <i data-feather="log-out"></i>
                </button>
            </div>
        </header>

        <!-- Core Content Area -->
        <main class="core-content">
            <!-- Recording Controls -->
            <div class="control-section top-controls">
                <button id="recordButton" class="btn btn-primary">
                    <i data-feather="mic"></i>
                    <span>Record</span>
                </button>
                <button id="stopButton" class="btn btn-secondary">
                    <i data-feather="square"></i>
                    <span>Stop</span>
                </button>
            </div>

            <!-- Transcription Output Box -->
            <div id="transcriptionOutput" class="output-box" placeholder="Your transcript will appear here..."></div>

            <!-- Analysis Controls -->
            <div class="control-section bottom-controls">
                <button id="summarizeButton" class="btn btn-primary" disabled>
                    <i data-feather="file-text"></i>
                    <span>Summarize</span>
                </button>
            </div>
        </main>

        <!-- Footer for Pro AI Tools -->
        <footer class="main-footer">
            <div class="relative">
                <button type="button" id="aiDropdownButton" class="btn btn-secondary pro-tools-btn" disabled>
                    <i data-feather="sparkles"></i>
                    <span>Advanced AI Tools</span>
                    <i data-feather="chevron-down" class="chevron"></i>
                </button>
                <div id="aiDropdownMenu" class="origin-bottom-right absolute right-0 bottom-full mb-2 w-56 rounded-md shadow-lg bg-slate-800 ring-1 ring-slate-700 focus:outline-none hidden" role="menu">
                    <div class="py-1" role="none">
                        <p class="px-4 py-2 text-xs text-slate-400 uppercase">Freemium Features</p>
                        <button data-prompt-id="key_concepts" class="ai-button">Key Concepts</button>
                        <button data-prompt-id="action_items" class="ai-button">Action Items</button>
                        <div class="border-t border-slate-700 my-1"></div>
                        <p class="px-4 py-2 text-xs text-slate-400 uppercase">Pro Features</p>
                        <button data-prompt-id="generate_flashcards" class="ai-button pro-feature">Generate Flashcards</button>
                    </div>
                </div>
            </div>
        </footer>

    </div> <!-- End App Container -->
    
    <!-- Floating Debug Button -->
    <button id="debugButton" class="debug-button" title="Generate Debug Report">
        <i data-feather="bug"></i>
    </button>

    <!-- Modal for displaying summaries, errors, etc. -->
    <div id="modal-backdrop" class="fixed inset-0 bg-black bg-opacity-70 flex items-center justify-center p-4 hidden opacity-0">
        <div id="modal-content" class="modal-content-area">
            <div class="flex justify-between items-center mb-4">
                <h2 id="modal-title" class="text-2xl font-semibold text-slate-100" style="font-family: 'Lora', serif;"></h2>
                <button id="modal-close" class="text-slate-400 hover:text-slate-100 text-3xl leading-none">&times;</button>
            </div>
            <div id="modal-body" class="text-slate-300 max-h-96 overflow-y-auto"></div>
             <!-- Feedback UI will be added here by JS -->
            <div id="modal-feedback" class="mt-4 pt-4 border-t border-slate-700 text-center hidden"></div>
        </div>
    </div>

    <!-- Main Application Script -->
    <script type="module" src="app.js"></script>
    <script>
        // Initialize Feather Icons
        feather.replace();
    </script>

</body>
</html>
