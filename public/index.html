<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Learning Assistant</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Custom Stylesheet -->
    <link rel="stylesheet" href="styles.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Lora:wght@700&display=swap" rel="stylesheet">
</head>
<body>

    <div id="app-container">
        
        <div class="header-bar">
            <div id="apiKeyContainer" class="interactive-icon-container">
                 <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon-animated text-slate-500"><circle cx="7" cy="12" r="4"></circle><line x1="11" y1="12" x2="22" y2="12"></line><line x1="14" y1="12" x2="14" y2="16"></line><line x1="17" y1="12" x2="17" y2="18"></line><line x1="20" y1="12" x2="20" y2="15"></line></svg>
                <input type="password" id="apiKeyInput" class="input-base" placeholder="Enter Session API Key...">
            </div>

            <div class="relative">
                <div id="loginContainer" class="interactive-icon-container">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon-animated icon-animated-user text-slate-500 transition-transform duration-300"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                    <div id="login-form" class="flex flex-col">
                        <input type="email" id="emailInput" class="login-input text-sm" placeholder="Email">
                        <div id="password-wrapper" class="login-form-extra">
                            <input type="password" id="passwordInput" class="login-input text-sm" placeholder="Password">
                        </div>
                         <div id="auth-buttons" class="login-form-extra space-y-2">
                            <button id="loginButton" class="w-full text-sm bg-blue-600 text-white py-1.5 rounded-md hover:bg-blue-700">Login / Sign Up</button>
                        </div>
                    </div>
                </div>

                <div id="userInfo" class="hidden items-center gap-4">
                     <span id="userEmail" class="text-sm font-medium text-slate-700"></span>
                     <button id="historyButton" title="View History" class="text-slate-500 hover:text-blue-600">
                        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 4v6h6"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
                     </button>
                     <button id="settingsButton" title="Settings" class="text-slate-500 hover:text-blue-600">
                         <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
                     </button>
                     <button id="logoutButton" class="text-slate-500 hover:text-red-600">
                         <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
                     </button>
                 </div>
            </div>
        </div>

        <div class="header-content">
            <h1 class="text-3xl font-bold text-slate-800">YouTube Learning Assistant</h1>
            <p class="text-sm text-slate-500 mt-1">Capture a video's knowledge. Master it faster.</p>
        </div>
        
        <div id="error-message" class="hidden bg-red-100 border border-red-300 text-red-800 px-4 py-3 rounded-lg" role="alert">
            <strong class="font-bold">Error:</strong>
            <span class="block sm:inline" id="error-text"></span>
        </div>
        
        <div class="main-content">
            <div class="bg-slate-50 p-4 rounded-lg border border-slate-200 flex flex-col h-full">
                <div id="transcriptionOutput" class="output-box flex-grow" placeholder="Your transcript will appear here after recording..."></div>
                <div class="flex justify-between items-center mt-4">
                    <p class="text-sm text-slate-500 h-5">Status: <span id="status" class="font-semibold text-blue-700">Ready</span></p>
                    <div class="flex items-center gap-2">
                        <button id="recordButton" class="btn-icon bg-red-600 hover:bg-red-700 focus:ring-red-500" title="Record"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle></svg></button>
                        <button id="pauseButton" class="btn-icon bg-gray-500 hover:bg-gray-600 focus:ring-gray-400 btn-disabled" disabled title="Pause"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 4h4v16H6z"/><path d="M14 4h4v16h-4z"/></svg></button>
                        <button id="transcribeButton" class="btn-icon bg-blue-600 hover:bg-blue-700 focus:ring-blue-500 btn-disabled" disabled title="Transcribe"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="22"/></svg></button>
                    </div>
                </div>
            </div>
        </div>

        <div class="footer-bar">
            <div class="relative inline-block text-left">
                <button type="button" id="aiDropdownButton" class="btn btn-secondary w-full flex justify-center items-center gap-2 btn-disabled" disabled>
                    AI Tools
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                </button>
                <div id="aiDropdownMenu" class="origin-bottom-right absolute right-0 bottom-full mb-2 w-56 rounded-md shadow-lg bg-white ring-1 ring-black ring-opacity-5 focus:outline-none hidden" role="menu">
                    <div class="py-1" role="none">
                        <p class="px-4 py-2 text-xs text-slate-400 uppercase">Freemium Features</p>
                        <button data-prompt-id="summarize" class="ai-button">Summarize</button>
                        <button data-prompt-id="key_concepts" class="ai-button">Key Concepts</button>
                        <button data-prompt-id="action_items" class="ai-button">Action Items</button>
                        <div class="border-t border-slate-100 my-1"></div>
                        <p class="px-4 py-2 text-xs text-slate-400 uppercase">Pro Features</p>
                        <button data-prompt-id="generate_flashcards" class="ai-button pro-feature">Generate Flashcards</button>
                    </div>
                </div>
            </div>
        </div>

        <button id="debugButton" class="fixed bottom-4 right-4 bg-slate-800 text-white p-2 rounded-full shadow-lg hover:bg-slate-900 transition-colors" title="Generate Debug Report">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 4.5l-2.7 5.4-5.4 2.7 5.4 2.7 2.7 5.4 2.7-5.4 5.4-2.7-5.4-2.7-2.7-5.4zM7 21l-4-4"/></svg>
        </button>
    </div>

    <div id="modal-backdrop" class="fixed inset-0 bg-black bg-opacity-60 flex items-center justify-center p-4 hidden opacity-0">
        <div id="modal-content" class="bg-white rounded-lg shadow-xl w-full max-w-lg p-6 transform scale-95 opacity-0">
            <div class="flex justify-between items-center mb-4">
                <h2 id="modal-title" class="text-2xl font-semibold text-slate-900"></h2>
                <button id="modal-close" class="text-slate-400 hover:text-slate-800 text-2xl leading-none">&times;</button>
            </div>
            <div id="modal-body" class="text-slate-700 max-h-96 overflow-y-auto"></div>
            <div id="modal-feedback" class="mt-4 pt-4 border-t border-slate-200 text-center hidden">
                <p class="text-sm text-slate-600 mb-2">Was this response helpful?</p>
                <div class="flex justify-center gap-4">
                    <button class="feedback-btn p-2 rounded-full hover:bg-green-100" data-rating="positive">
                        <svg class="w-6 h-6 text-green-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M6.633 10.5c.806 0 1.533-.424 2.031-1.08a9.041 9.041 0 012.861-2.4c.723-.384 1.35-.956 1.653-1.715a4.498 4.498 0 00.322-1.672V3a.75.75 0 01.75-.75A2.25 2.25 0 0116.5 4.5c0 1.152-.26 2.243-.723 3.218-.266.558.107 1.282.725 1.282h3.126c1.026 0 1.945.694 2.054 1.715.045.422.068.85.068 1.285a11.95 11.95 0 01-2.649 7.521c-.388.482-.987.729-1.605.729H13.48c-.483 0-.964-.078-1.423-.23l-3.114-1.04a4.501 4.501 0 00-1.423-.23H5.904M6.633 10.5l-1.87-1.87a.75.75 0 00-1.06 1.061l1.87 1.87M6.633 10.5v11.25c0 .621-.504 1.125-1.125 1.125H3.388c-.621 0-1.125-.504-1.125-1.125V10.5" /></svg>
                    </button>
                    <button class="feedback-btn p-2 rounded-full hover:bg-red-100" data-rating="negative">
                        <svg class="w-6 h-6 text-red-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M7.864 4.5c.806 0 1.533.424 2.031 1.08a9.041 9.041 0 012.861 2.4c.723-.384 1.35-.956 1.653-1.715a4.498 4.498 0 00.322-1.672V3a.75.75 0 01.75-.75A2.25 2.25 0 0116.5 4.5c0 1.152-.26 2.243-.723 3.218-.266.558.107 1.282.725 1.282h3.126c1.026 0 1.945.694 2.054 1.715.045.422.068.85.068 1.285a11.95 11.95 0 01-2.649 7.521c-.388.482-.987.729-1.605.729H13.48c-.483 0-.964-.078-1.423-.23l-3.114-1.04a4.501 4.501 0 00-1.423-.23H5.904M7.864 4.5L6 6.375v11.25c0 .621-.504 1.125-1.125 1.125H3.388c-.621 0-1.125-.504-1.125-1.125V6.375L6 4.5" /></svg>
                    </button>
                </div>
                <div id="detailed-feedback-container" class="mt-2 hidden">
                     <textarea id="detailed-feedback-input" class="w-full text-sm border-slate-300 rounded-md" placeholder="Optional: Why was this unhelpful?"></textarea>
                     <button id="submit-detailed-feedback" class="mt-2 text-xs bg-slate-600 text-white px-2 py-1 rounded-md">Submit Feedback</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Main Application Script -->
    <script type="module" src="app.js"></script>

</body>
</html>
