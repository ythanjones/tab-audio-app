<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI-Powered Audio Transcriber</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Inter font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* Apply Inter font to the body */
        body {
            font-family: 'Inter', sans-serif;
        }
        /* Custom styles for disabled button state */
        .btn-disabled {
            cursor: not-allowed;
            opacity: 0.5;
            pointer-events: none;
        }
        /* Styles for the modal */
        .modal-backdrop {
            transition: opacity 0.3s ease;
        }
        .modal-content {
            transition: transform 0.3s ease, opacity 0.3s ease;
        }
        
        /* Mischievous Map Text Animation */
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .text-reveal-word {
            opacity: 0;
            animation: fadeIn 0.5s forwards;
        }
        
        /* Shared styles for interactive inputs */
        .interactive-icon-container {
            display: flex;
            gap: 0.5rem;
            cursor: pointer;
            align-items: flex-start; /* Align icons to the top */
        }
        .icon-animated {
            transition: transform 0.3s ease;
            margin-top: 0.25rem; /* Nudge icons down to align with text */
        }
        .interactive-icon-container.is-active .icon-animated {
             transform: rotate(-15deg);
        }
         .interactive-icon-container.is-active .icon-animated-user {
            transform: scale(1.1);
        }
        
        /* API Key Input Animation */
        #apiKeyInput {
            width: 0;
            padding: 0.5rem 0;
            border-width: 0;
            opacity: 0;
            transition: width 0.4s ease-in-out, opacity 0.3s ease-in-out, padding 0.4s ease-in-out;
            background-color: transparent;
        }
        #apiKeyContainer.is-active #apiKeyInput {
            width: 240px;
            opacity: 1;
            padding: 0.5rem;
            border-width: 1px;
        }

        /* Login Form Animation */
        #login-form {
            width: 0;
            opacity: 0;
            overflow: visible; /* Allow password to be visible outside */
            transition: width 0.4s ease-in-out, opacity 0.3s ease-in-out;
        }
        #loginContainer.is-active #login-form {
            width: 180px;
            opacity: 1;
        }
        .login-input {
            padding: 0.5rem;
            border: 1px solid #e2e8f0; /* slate-200 */
            border-radius: 0.375rem; /* rounded-md */
            background-color: #f8fafc; /* slate-50 */
            width: 100%;
        }
        
        /* Joke Gun Flag Animation for Password & Buttons */
        .login-form-extra {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease-in-out, margin-top 0.3s ease-in-out;
        }
        #loginContainer.is-fully-open .login-form-extra {
            max-height: 100px; /* Reveal space for the content */
            margin-top: 0.5rem; /* Create gap */
        }
        
        /* Logged In State UI */
        #userInfo { display: none; }
        .logged-in #loginContainer { display: none; }
        .logged-in #userInfo { display: flex; align-items: center; gap: 0.75rem; }
        .logged-in #apiKeyContainer { opacity: 0.4; pointer-events: none; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 flex items-center justify-center min-h-screen p-4">

    <!-- Main container for the application -->
    <div id="app-container" class="w-full max-w-3xl mx-auto p-8 bg-white rounded-lg border border-slate-200 shadow-sm space-y-8 relative">
        
        <!-- Top bar for icons -->
        <div class="absolute top-0 left-0 w-full flex justify-between items-start px-8 py-6">
            <!-- API Key Icon and Input -->
            <div id="apiKeyContainer" class="interactive-icon-container">
                 <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon-animated text-slate-400">
                    <circle cx="7" cy="12" r="4"></circle>
                    <line x1="11" y1="12" x2="22" y2="12"></line>
                    <line x1="14" y1="12" x2="14" y2="16"></line>
                    <line x1="17" y1="12" x2="17" y2="18"></line>
                    <line x1="20" y1="12" x2="20" y2="15"></line>
                </svg>
                <input type="password" id="apiKeyInput" class="border-slate-300 rounded-md p-2 text-slate-800 focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Enter Session API Key...">
            </div>

            <!-- Login Icon and Inputs -->
             <div id="loginContainer" class="interactive-icon-container flex-row-reverse">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon-animated icon-animated-user text-slate-400 transition-transform duration-300">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                    <circle cx="12" cy="7" r="4"></circle>
                </svg>
                <div id="login-form" class="flex flex-col">
                    <input type="email" id="emailInput" class="login-input text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Email">
                    <div id="password-wrapper" class="login-form-extra">
                        <input type="password" id="passwordInput" class="login-input text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Password">
                    </div>
                     <div id="auth-buttons" class="login-form-extra space-y-2">
                        <button id="loginButton" class="w-full text-sm bg-blue-600 text-white py-1.5 rounded-md">Login / Sign Up</button>
                    </div>
                </div>
            </div>

            <!-- User Info / Logout Button -->
             <div id="userInfo" class="items-center gap-4">
                 <span id="userEmail" class="text-sm font-medium text-slate-600"></span>
                 <!-- History Button -->
                 <button id="historyButton" title="View History" class="text-slate-500 hover:text-blue-600">
                    <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 4v6h6"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
                 </button>
                 <!-- Settings Button -->
                 <button id="settingsButton" title="Settings" class="text-slate-500 hover:text-blue-600">
                     <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
                 </button>
                 <button id="logoutButton" class="text-slate-500 hover:text-red-600">
                     <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
                 </button>
             </div>
        </div>

        <!-- Header -->
        <div class="text-center pt-20">
            <h1 class="text-4xl font-semibold text-slate-900">Audio Transcriber</h1>
        </div>
        
        <!-- Error Message Display -->
        <div id="error-message" class="hidden bg-red-100 border border-red-300 text-red-800 px-4 py-3 rounded-lg" role="alert">
            <strong class="font-bold">Error:</strong>
            <span class="block sm:inline" id="error-text"></span>
        </div>
        
        <!-- Controls & Status Section -->
        <div class="text-center space-y-4 pt-4">
             <div class="flex flex-col sm:flex-row items-center justify-center gap-4">
                <button id="startButton" class="w-full sm:w-auto border border-blue-600 text-blue-600 font-semibold py-2 px-6 rounded-md transition-all duration-200 hover:bg-blue-600 hover:text-white focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-opacity-75">
                    Start Recording
                </button>
                <button id="stopButton" class="w-full sm:w-auto border border-slate-400 text-slate-500 font-semibold py-2 px-6 rounded-md transition-all duration-200 hover:bg-slate-500 hover:text-white focus:outline-none focus:ring-2 focus:ring-slate-400 focus:ring-opacity-75 btn-disabled" disabled>
                    Stop Recording
                </button>
            </div>
            <p class="text-sm text-slate-500 h-5">Status: <span id="status" class="font-semibold text-blue-600"></span></p>
        </div>

        <!-- Transcription & AI Actions Section -->
        <div class="space-y-4 pt-8 border-t border-slate-200">
            <div class="flex justify-between items-center">
                 <!-- Transcription Output DIV, styled like a textarea -->
                <div id="transcriptionOutput" class="w-full h-48 bg-slate-50 border border-slate-300 rounded-md p-4 text-slate-700 overflow-y-auto focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Transcription will appear here..."></div>
                <button id="saveButton" class="ml-4 px-4 py-2 text-sm font-semibold text-white bg-green-600 rounded-md hover:bg-green-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-green-500 btn-disabled" disabled title="Save Transcript">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>
                </button>
            </div>


            <!-- AI Actions -->
             <div id="aiActions" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                <button id="summarizeButton" class="w-full border border-slate-400 text-slate-500 font-semibold py-2 px-4 rounded-md transition-all duration-200 hover:bg-slate-500 hover:text-white btn-disabled" disabled>Summarize</button>
                <button id="actionItemsButton" class="w-full border border-slate-400 text-slate-500 font-semibold py-2 px-4 rounded-md transition-all duration-200 hover:bg-slate-500 hover:text-white btn-disabled" disabled>Action Items</button>
                <button id="extractTopicsButton" class="w-full border border-slate-400 text-slate-500 font-semibold py-2 px-4 rounded-md transition-all duration-200 hover:bg-slate-500 hover:text-white btn-disabled" disabled>Extract Topics</button>
                <button id="cleanUpButton" class="w-full border border-slate-400 text-slate-500 font-semibold py-2 px-4 rounded-md transition-all duration-200 hover:bg-slate-500 hover:text-white btn-disabled" disabled>Clean Up</button>
             </div>
        </div>
    </div>

    <!-- Modal for AI Results & Settings -->
    <div id="modal-backdrop" class="fixed inset-0 bg-black bg-opacity-60 flex items-center justify-center p-4 hidden opacity-0">
        <div id="modal-content" class="bg-white rounded-lg shadow-xl w-full max-w-lg p-6 transform scale-95 opacity-0">
            <div class="flex justify-between items-center mb-4">
                <h2 id="modal-title" class="text-2xl font-semibold text-slate-900"></h2>
                <button id="modal-close" class="text-slate-400 hover:text-slate-800 text-2xl leading-none">&times;</button>
            </div>
            <div id="modal-body" class="text-slate-700 max-h-96 overflow-y-auto"></div>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.9.1/firebase-app.js";
        import { getAnalytics, logEvent as fbLogEvent } from "https://www.gstatic.com/firebasejs/11.9.1/firebase-analytics.js";
        import { getFirestore, collection, addDoc, query, where, getDocs, orderBy, limit, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/11.9.1/firebase-firestore.js";
        import { 
            getAuth, 
            onAuthStateChanged,
            createUserWithEmailAndPassword,
            signInWithEmailAndPassword,
            signOut
        } from "https://www.gstatic.com/firebasejs/11.9.1/firebase-auth.js";

        // Your web app's Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyBruGCfWHwVbxWC5mGUDTHAjT_1vcXveiw",
            authDomain: "tab-audio-app.firebaseapp.com",
            projectId: "tab-audio-app",
            storageBucket: "tab-audio-app.firebasestorage.app",
            messagingSenderId: "715569829205",
            appId: "1:715569829205:web:216b98f170035f2fcf0bdc",
            measurementId: "G-BDW8YWD1QW"
        };

        // DOM element references
        const appContainer = document.getElementById('app-container');
        const startButton = document.getElementById('startButton');
        const stopButton = document.getElementById('stopButton');
        const statusEl = document.getElementById('status');
        const outputEl = document.getElementById('transcriptionOutput');
        const errorDisplay = document.getElementById('error-message');
        const errorText = document.getElementById('error-text');
        
        // Interactive icon elements
        const apiKeyContainer = document.getElementById('apiKeyContainer');
        const apiKeyInput = document.getElementById('apiKeyInput');
        const loginContainer = document.getElementById('loginContainer');
        const loginForm = document.getElementById('login-form');
        const emailInput = document.getElementById('emailInput');
        const passwordInput = document.getElementById('passwordInput');
        const loginButton = document.getElementById('loginButton');
        const userInfo = document.getElementById('userInfo');
        const userEmailEl = document.getElementById('userEmail');
        const logoutButton = document.getElementById('logoutButton');
        const historyButton = document.getElementById('historyButton');
        const settingsButton = document.getElementById('settingsButton');
        const saveButton = document.getElementById('saveButton');
        
        // AI Action Buttons
        const summarizeButton = document.getElementById('summarizeButton');
        const actionItemsButton = document.getElementById('actionItemsButton');
        const extractTopicsButton = document.getElementById('extractTopicsButton');
        const cleanUpButton = document.getElementById('cleanUpButton');

        const modalBackdrop = document.getElementById('modal-backdrop');
        const modalContent = document.getElementById('modal-content');
        const modalTitle = document.getElementById('modal-title');
        const modalBody = document.getElementById('modal-body');
        const modalClose = document.getElementById('modal-close');

        // State variables
        let mediaRecorder;
        let audioStream;
        let animationTimeout;
        let currentUser = null; 
        let activeApiKey = null; // Single source of truth for the API key being used
        let activeContainer = null;
        let firebaseInitialized = false;
        let analytics, db;
        let recordingStartTime;
        let recordingFeedbackInterval;

        // Initialize Firebase
        try {
            if (!firebaseConfig.apiKey) {
                 throw new Error("Firebase config object is empty. Please paste your project's configuration keys into the script.");
            }
            const app = initializeApp(firebaseConfig);
            const auth = getAuth(app);
            analytics = getAnalytics(app);
            db = getFirestore(app);
            firebaseInitialized = true;

            onAuthStateChanged(auth, async (user) => {
                currentUser = user;
                if (user) {
                    appContainer.classList.add('logged-in');
                    userEmailEl.textContent = user.email;
                    closeContainer(loginContainer);
                    await fetchUserApiKey();
                } else {
                    appContainer.classList.remove('logged-in');
                    userEmailEl.textContent = '';
                    activeApiKey = null; // Clear key on logout
                }
            });

            async function handleAuth() {
                const email = emailInput.value;
                const password = passwordInput.value;
                if (!email || !password) {
                    showError("Please enter both email and password.");
                    return;
                }
                hideError();

                try {
                    await signInWithEmailAndPassword(auth, email, password);
                    logEvent('user_action', { action_type: 'login' });
                } catch (error) {
                    if (error.code === 'auth/user-not-found' || error.code === 'auth/invalid-credential') {
                        try {
                            await createUserWithEmailAndPassword(auth, email, password);
                             logEvent('user_action', { action_type: 'signup' });
                        } catch (signUpError) {
                            showError(signUpError.message);
                        }
                    } else {
                        showError(error.message);
                    }
                }
            }
        
            function handleLogout() {
                signOut(auth).then(() => {
                    logEvent('user_action', { action_type: 'logout' });
                }).catch(error => showError(error.message));
            }

            loginButton.addEventListener('click', (e) => {
                e.stopPropagation();
                handleAuth();
            });
            logoutButton.addEventListener('click', handleLogout);

        } catch (error) {
            console.error("Firebase Initialization Error:", error.message);
            showError(error.message, true);
        }

        function logEvent(name, params) {
            if (analytics) {
                fbLogEvent(analytics, name, params);
            } else {
                console.log(`Analytics not initialized. Event not logged: ${name}`, params);
            }
        }

        function closeContainer(container) {
            if (!container || !container.classList.contains('is-active')) return;

            if (container.id === 'loginContainer') {
                container.classList.remove('is-fully-open');
                setTimeout(() => container.classList.remove('is-active'), 300);
            } else {
                container.classList.remove('is-active');
            }

            if (activeContainer === container) {
                activeContainer = null;
            }
        }

        function openContainer(containerToOpen) {
            if (activeContainer && activeContainer !== containerToOpen) {
                closeContainer(activeContainer);
            }
            
            containerToOpen.classList.add('is-active');
            activeContainer = containerToOpen;

            if (containerToOpen.id === 'loginContainer') {
                 setTimeout(() => {
                    if (containerToOpen.classList.contains('is-active')) containerToOpen.classList.add('is-fully-open');
                }, 400);
            } else if (containerToOpen.id === 'apiKeyContainer') {
                setTimeout(() => {
                    if (containerToOpen.classList.contains('is-active')) apiKeyInput.focus();
                }, 400);
            }
        }

        [apiKeyContainer, loginContainer].forEach(container => {
            container.addEventListener('click', (e) => {
                e.stopPropagation();
                if (e.target.tagName === 'INPUT') return;
                if (activeContainer === container) closeContainer(container);
                else openContainer(container);
            });
        });

        document.addEventListener('click', () => { if (activeContainer) closeContainer(activeContainer); });

        apiKeyInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                validateApiKey(apiKeyInput.value.trim());
            }
        });

        function animateText(element, text, delay = 30) {
            clearTimeout(animationTimeout);
            element.innerHTML = '';
            const words = text.split(/\s+/).filter(w => w.length > 0);
            if (words.length === 0 && text.trim() === '') {
                element.innerHTML = ' ';
                return;
            }
            words.forEach((word, index) => {
                const wordSpan = document.createElement('span');
                wordSpan.textContent = word + ' ';
                wordSpan.className = 'text-reveal-word';
                wordSpan.style.animationDelay = `${index * delay}ms`;
                element.appendChild(wordSpan);
            });
        }
        
        function getApiKey() {
            if (activeApiKey) {
                hideError();
                return activeApiKey;
            }
            showError("Please log in and set your API key in settings, or provide a session key.");
            return null;
        }

        async function validateApiKey(key, shouldSave = false) {
            if (!key) {
                showError("API key field is empty.");
                return;
            }
            animateText(statusEl, "Validating API Key...");
            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${key}`;
            const payload = { contents: [{ parts: [{ text: "hello" }] }] };
            try {
                const response = await fetch(apiUrl, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
                if (response.ok) {
                    activeApiKey = key; // Set the single source of truth for the API key
                    animateText(statusEl, "API Key is valid.");
                    logEvent('api_key_validated', { success: true });
                    hideError();
                    closeContainer(apiKeyContainer);
                    if (currentUser && shouldSave) {
                        await saveUserApiKey(key);
                        animateText(statusEl, "API Key saved to your profile.");
                    }
                } else {
                    const error = await response.json();
                    throw new Error(error.error.message || `HTTP error! status: ${response.status}`);
                }
            } catch (err) {
                console.error("API Key validation error:", err);
                logEvent('api_key_validated', { success: false, error_message: err.message });
                showError(`API Key validation failed: ${err.message}`);
                animateText(statusEl, "Invalid API Key.");
            }
        }


        function showError(message, isCritical = false) {
            errorText.textContent = message;
            errorDisplay.classList.remove('hidden');
            if(isCritical) {
                errorDisplay.classList.add('bg-red-200', 'border-red-500', 'text-red-900', 'p-4', 'font-bold');
            }
        }

        function hideError() {
            if (!errorDisplay.classList.contains('hidden')) {
                errorDisplay.classList.add('hidden');
            }
        }

        function setAiButtonsState(enabled) {
            const buttons = [summarizeButton, actionItemsButton, extractTopicsButton, cleanUpButton];
            buttons.forEach(button => {
                button.disabled = !enabled;
                button.classList.toggle('btn-disabled', !enabled);
            });
            saveButton.disabled = !enabled;
            saveButton.classList.toggle('btn-disabled', !enabled);
        }
        
        function updateUI(status, message = '') {
            animateText(statusEl, message || status);
            startButton.disabled = (status === 'Recording...');
            startButton.classList.toggle('btn-disabled', status === 'Recording...');
            stopButton.disabled = (status !== 'Recording...');
            stopButton.classList.toggle('btn-disabled', status !== 'Recording...');
        }

        async function handleStartClick() {
            if (!firebaseInitialized) {
                showError("Cannot start recording. Firebase is not configured correctly.", true);
                return;
            }
            hideError();
            if (!getApiKey()) return;

            if (!navigator.mediaDevices || !navigator.mediaDevices.getDisplayMedia) {
                showError("Your browser does not support screen capture.");
                return;
            }
            try {
                const displayStream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: true });
                if (displayStream.getAudioTracks().length > 0) {
                    audioStream = new MediaStream(displayStream.getAudioTracks());
                    displayStream.getVideoTracks()[0].stop();
                    
                    logEvent('recording_started', { user_id: currentUser ? currentUser.uid : 'anonymous' });
                    recordingStartTime = Date.now();
                    const audioChunks = [];

                    mediaRecorder = new MediaRecorder(audioStream, { mimeType: 'audio/webm' });
                    
                    mediaRecorder.onstop = async () => {
                         if (recordingFeedbackInterval) clearInterval(recordingFeedbackInterval);
                         const duration_seconds = Math.round((Date.now() - recordingStartTime) / 1000);
                         updateUI('Transcribing...', 'Finalizing transcription...');
                         const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                         if (audioBlob.size === 0) {
                             updateUI('Stopped', 'No audio was recorded.');
                             logEvent('recording_stopped', { duration_seconds, final_word_count: 0 });
                             return;
                         }
                         const base64String = await blobToBase64(audioBlob);
                         await transcribeAudio(base64String);
                         const final_word_count = outputEl.textContent.trim().split(/\s+/).length;
                         logEvent('recording_stopped', { duration_seconds, final_word_count });
                    };
                    
                    mediaRecorder.ondataavailable = (event) => {
                        if (event.data.size > 0) audioChunks.push(event.data);
                    };
                    
                    outputEl.innerHTML = '';
                    setAiButtonsState(false);
                    updateUI('Recording...', 'Recording...');
                    mediaRecorder.start();

                    let dotCount = 1;
                    recordingFeedbackInterval = setInterval(() => {
                        animateText(statusEl, "Recording" + ".".repeat(dotCount));
                        dotCount = (dotCount % 3) + 1;
                    }, 500);
                    
                    audioStream.getTracks()[0].onended = () => handleRecordingStop();
                } else {
                    showError("No audio track found. Please ensure you share tab audio.");
                    displayStream.getTracks().forEach(track => track.stop());
                }
            } catch (err) {
                console.error("Error starting recording:", err);
                updateUI('Error', 'Failed to start recording.');
                if (err.name === 'NotAllowedError' || err.name === 'AbortError') {
                    showError('Permission to capture screen/audio was denied.');
                } else {
                    showError(`An unknown error occurred: ${err.message}`);
                }
            }
        }
        
        function handleRecordingStop() {
            if (recordingFeedbackInterval) clearInterval(recordingFeedbackInterval);
            if (mediaRecorder && mediaRecorder.state === 'recording') {
                mediaRecorder.stop();
            }
            if (audioStream) {
                audioStream.getTracks().forEach(track => track.stop());
            }
            updateUI('Stopped', 'Stopped');
        }
        
        function blobToBase64(blob) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(blob);
                reader.onloadend = () => resolve(reader.result.split(',')[1]);
                reader.onerror = reject;
            });
        }
        
        async function transcribeAudio(base64Audio) {
            const apiKey = getApiKey();
            if (!apiKey) return;

            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`;
            const payload = { contents: [{ parts: [{ text: "Transcribe the following audio recording." }, { inline_data: { mime_type: "audio/webm", data: base64Audio } }] }] };

            try {
                const response = await fetch(apiUrl, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.error.message || `API Error: ${response.status}`);
                }
                
                const result = await response.json();
                if (result.candidates && result.candidates[0].content.parts[0].text) {
                    const transcript = result.candidates[0].content.parts[0].text;
                    outputEl.textContent = transcript; // Use textContent for raw text
                    updateUI('Transcription Complete', 'Transcription Complete');
                    setAiButtonsState(true);
                    logEvent('chunk_transcribed', { success: true });
                } else {
                    throw new Error('Invalid API response.');
                }
            } catch (err) {
                 logEvent('transcription_failed', { error_code: 'CLIENT_SIDE', error_message: err.message });
                 showError(`Transcription Failed: ${err.message}`);
                 updateUI('Transcription Failed', 'Transcription Failed');
            }
        }

        async function generateTextWithGemini(prompt, taskTitle) {
            const apiKey = getApiKey();
            if (!apiKey) return;

            openModal(taskTitle, '<div class="flex justify-center items-center"><div class="animate-spin rounded-full h-8 w-8 border-b-2 border-blue-600"></div></div>');
            
            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`;
            const payload = { contents: [{ parts: [{ text: prompt }] }] };

            try {
                 const response = await fetch(apiUrl, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
                 if (!response.ok) throw new Error(`API Error: ${response.status}`);
                
                 const result = await response.json();
                 if (result.candidates && result.candidates[0].content.parts[0].text) {
                    const generatedText = result.candidates[0].content.parts[0].text.replace(/\*/g, '');
                    animateText(modalBody, generatedText);
                    // Also update the main text area if it's a "Clean Up" action
                    if (taskTitle === 'Cleaned Up Transcript') {
                        outputEl.textContent = generatedText;
                    }
                 } else {
                    throw new Error('Invalid API response.');
                 }
            } catch (err) {
                modalBody.innerHTML = `<p class="text-red-600">Could not generate ${taskTitle.toLowerCase()}. Error: ${err.message}</p>`;
            }
        }
        
        async function saveTranscript() {
            if (!currentUser) {
                showError("You must be logged in to save a transcript.");
                return;
            }
            const transcriptText = outputEl.textContent.trim();
            if (!transcriptText) {
                showError("There is no transcript to save.");
                return;
            }

            try {
                const docRef = await addDoc(collection(db, "users", currentUser.uid, "transcripts"), {
                    title: transcriptText.substring(0, 40) + "...",
                    content: transcriptText,
                    createdAt: new Date()
                });
                logEvent('transcript_saved', { doc_id: docRef.id });
                animateText(statusEl, "Transcript Saved!");
            } catch (e) {
                console.error("Error adding document: ", e);
                showError("Could not save transcript. Please try again.");
                logEvent('save_failed', { error: e.message });
            }
        }

        async function viewHistory() {
            if (!currentUser) {
                showError("You must be logged in to view history.");
                return;
            }
            
            openModal("Transcript History", '<div class="flex justify-center items-center"><div class="animate-spin rounded-full h-8 w-8 border-b-2 border-blue-600"></div></div>');
            
            try {
                const q = query(collection(db, "users", currentUser.uid, "transcripts"), orderBy("createdAt", "desc"), limit(20));
                const querySnapshot = await getDocs(q);
                
                if (querySnapshot.empty) {
                    modalBody.innerHTML = `<p class="text-slate-500">You have no saved transcripts.</p>`;
                    return;
                }

                const list = document.createElement('ul');
                list.className = 'space-y-2';
                
                querySnapshot.forEach((doc) => {
                    const data = doc.data();
                    const li = document.createElement('li');
                    li.className = 'p-3 rounded-md hover:bg-slate-100 cursor-pointer';
                    li.innerHTML = `<p class="font-semibold">${data.title}</p><p class="text-xs text-slate-500">${data.createdAt.toDate().toLocaleString()}</p>`;
                    li.onclick = () => {
                        outputEl.textContent = data.content;
                        setAiButtonsState(true);
                        closeModal();
                    };
                    list.appendChild(li);
                });
                modalBody.innerHTML = '';
                modalBody.appendChild(list);

            } catch(e) {
                 console.error("Error fetching history: ", e);
                 modalBody.innerHTML = `<p class="text-red-600">Could not load history.</p>`;
            }
        }
        
        async function saveUserApiKey(key) {
            if (!currentUser) return;
            try {
                const userDocRef = doc(db, "users", currentUser.uid);
                await setDoc(userDocRef, { geminiApiKey: key }, { merge: true });
                logEvent('api_key_saved');
            } catch (e) {
                console.error("Error saving API key: ", e);
                showError("Could not save your API key.");
            }
        }

        async function fetchUserApiKey() {
            if (!currentUser) return;
            try {
                const userDocRef = doc(db, "users", currentUser.uid);
                const docSnap = await getDoc(userDocRef);
                if (docSnap.exists() && docSnap.data().geminiApiKey) {
                    activeApiKey = docSnap.data().geminiApiKey;
                    console.log("User API key loaded.");
                } else {
                    activeApiKey = null;
                    console.log("No saved API key found for user.");
                }
            } catch (e) {
                console.error("Error fetching API key: ", e);
                activeApiKey = null;
            }
        }
        
        function openSettingsModal() {
            const settingsHtml = `
                <div class="space-y-4">
                     <div>
                        <label for="modalApiKey" class="block text-sm font-medium text-slate-700">Your Gemini API Key</label>
                        <div class="mt-1 relative rounded-md shadow-sm">
                             <input type="password" id="modalApiKey" class="block w-full rounded-md border-slate-300 pr-10 focus:border-blue-500 focus:ring-blue-500 sm:text-sm" placeholder="Paste your API key here...">
                             <div class="absolute inset-y-0 right-0 pr-3 flex items-center">
                                <button id="revealApiKeyBtn" class="text-slate-400 hover:text-slate-600">
                                     <svg id="eyeIcon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                                </button>
                             </div>
                        </div>
                    </div>
                    <div class="flex justify-end">
                        <button id="saveApiKeyBtn" class="px-4 py-2 text-sm font-semibold text-white bg-blue-600 rounded-md hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">
                           Save Key
                        </button>
                    </div>
                </div>
            `;
            openModal("User Settings", settingsHtml);
            
            const modalApiKeyInput = document.getElementById('modalApiKey');
            const revealApiKeyBtn = document.getElementById('revealApiKeyBtn');
            const saveApiKeyBtn = document.getElementById('saveApiKeyBtn');

            if (activeApiKey) {
                modalApiKeyInput.value = activeApiKey;
            }

            revealApiKeyBtn.addEventListener('click', () => {
                const isPassword = modalApiKeyInput.type === 'password';
                modalApiKeyInput.type = isPassword ? 'text' : 'password';
            });
            
            const saveAndClose = () => {
                 const newKey = modalApiKeyInput.value.trim();
                 if (newKey) {
                    validateApiKey(newKey, true); // true indicates it should be saved
                 }
                 closeModal();
            };

            saveApiKeyBtn.addEventListener('click', saveAndClose);
            modalApiKeyInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') saveAndClose();
            });
        }


        function openModal(title, content) {
            modalTitle.textContent = title;
            if (typeof content === 'string') {
                modalBody.innerHTML = content;
            } else {
                modalBody.innerHTML = '';
                modalBody.appendChild(content);
            }
            modalBackdrop.classList.remove('hidden');
            setTimeout(() => {
                modalBackdrop.classList.add('opacity-100');
                modalContent.classList.remove('scale-95', 'opacity-0');
            }, 10);
        }

        function closeModal() {
            modalBackdrop.classList.remove('opacity-100');
            modalContent.classList.add('scale-95', 'opacity-0');
            setTimeout(() => modalBackdrop.classList.add('hidden'), 300);
        }

        // --- Event Listeners ---
        startButton.addEventListener('click', handleStartClick);
        stopButton.addEventListener('click', handleRecordingStop);
        saveButton.addEventListener('click', saveTranscript);
        historyButton.addEventListener('click', viewHistory);
        settingsButton.addEventListener('click', openSettingsModal);

        const aiButtonHandler = (promptFn, taskTitle) => () => {
            const transcript = outputEl.textContent;
            if (transcript) {
                logEvent('ai_action_used', { action_type: taskTitle.toLowerCase().replace(/\s/g, '_') });
                generateTextWithGemini(promptFn(transcript), taskTitle);
            } else {
                showError("There is no transcript to analyze.");
            }
        };

        summarizeButton.addEventListener('click', aiButtonHandler(t => `Concisely summarize the following transcript:\n\n---\n${t}\n---`, "Summary"));
        actionItemsButton.addEventListener('click', aiButtonHandler(t => `List all action items from this transcript. If none, state that clearly:\n\n---\n${t}\n---`, "Action Items"));
        extractTopicsButton.addEventListener('click', aiButtonHandler(t => `Analyze the following transcript and extract the main topics or keywords discussed. Present them as a comma-separated list.\n\n---\n${t}\n---`, "Key Topics"));
        cleanUpButton.addEventListener('click', aiButtonHandler(t => `Rewrite the following transcript to be more readable and professional. Remove all filler words like "um", "uh", and "ah", correct any grammatical errors, and format it into clean paragraphs. Do not summarize, just clean it up.\n\n---\n${t}\n---`, "Cleaned Up Transcript"));
        
        modalClose.addEventListener('click', closeModal);
        
        updateUI('Initial', 'Ready');
    </script>
</body>
</html>
