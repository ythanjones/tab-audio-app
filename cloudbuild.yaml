# Cloud Build configuration for tab-audio-app
# Simplified version that works immediately

steps:
  # Step 1: Build Backend Service Docker Image
  - name: 'gcr.io/cloud-builders/docker'
    args: [
      'build',
      '-t', 'gcr.io/$PROJECT_ID/backend-service:$BUILD_ID',
      '-t', 'gcr.io/$PROJECT_ID/backend-service:latest',
      '-f', 'backend/Dockerfile',
      './backend'
    ]
    id: 'build-backend'

  # Step 2: Build Agent Backend Service Docker Image  
  - name: 'gcr.io/cloud-builders/docker'
    args: [
      'build',
      '-t', 'gcr.io/$PROJECT_ID/agent-backend-service:$BUILD_ID',
      '-t', 'gcr.io/$PROJECT_ID/agent-backend-service:latest',
      '-f', 'agent-backend/Dockerfile', 
      './agent-backend'
    ]
    id: 'build-agent-backend'

  # Step 3: Push Backend Service Image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/backend-service:$BUILD_ID']
    waitFor: ['build-backend']
    id: 'push-backend'

  # Step 4: Push Agent Backend Service Image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/agent-backend-service:$BUILD_ID']
    waitFor: ['build-agent-backend'] 
    id: 'push-agent-backend'

  # Step 5: Deploy Backend Service to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args: [
      'run', 'deploy', 'backend-service',
      '--image', 'gcr.io/$PROJECT_ID/backend-service:$BUILD_ID',
      '--platform', 'managed',
      '--region', 'europe-west2',
      '--allow-unauthenticated',
      '--port', '8080',
      '--memory', '1Gi',
      '--cpu', '1',
      '--max-instances', '10',
      '--set-env-vars', 'NODE_ENV=production,PORT=8080',
      '--project', '$PROJECT_ID'
    ]
    waitFor: ['push-backend']
    id: 'deploy-backend'

  # Step 6: Deploy Agent Backend Service to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args: [
      'run', 'deploy', 'agent-backend-service',
      '--image', 'gcr.io/$PROJECT_ID/agent-backend-service:$BUILD_ID',
      '--platform', 'managed',
      '--region', 'europe-west2',
      '--allow-unauthenticated',
      '--port', '8080',
      '--memory', '1Gi',
      '--cpu', '1',
      '--max-instances', '10',
      '--set-env-vars', 'NODE_ENV=production,PORT=8080,GEMINI_API_KEY=AIzaSyCH7jBG_iSTFAYrWEtazEvlXk2ZC413AGo,PROJECT_ID=$PROJECT_ID',
      '--project', '$PROJECT_ID'
    ]
    waitFor: ['push-agent-backend']
    id: 'deploy-agent-backend'

# Build options
options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'

# Timeout for the entire build (20 minutes)
timeout: '1200s'

# Images to be pushed to Container Registry
images:
  - 'gcr.io/$PROJECT_ID/backend-service:$BUILD_ID'
  - 'gcr.io/$PROJECT_ID/backend-service:latest'
  - 'gcr.io/$PROJECT_ID/agent-backend-service:$BUILD_ID' 
  - 'gcr.io/$PROJECT_ID/agent-backend-service:latest'